_ > nanoagent.plugin.v0001.ManifestConfig:
id: minesweeper-verifier
name: Minesweeper
version: 0.1.10
status: ready
spec: nanoagent.plugin/v0001
runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]
permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_board:
    description: Start or inspect a game, showing only visible cells
  reveal_cell:
    description: Reveal a covered cell in the AI game
  play_turn:
    description: Start with guess null, or guess one covered cell. Reveals all guaranteed safe cells and returns the board.
  play_game:
    description: Execute the AI’s reveal order on a fresh board and return the completed game.
  compare_scores:
    description: Verify and compare completed human and AI games
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  play-game:
    description: |-
      Default action for a new chat message, including “play the game” and “play again”.
      Start a fresh round every time. For comparison requests, use compare-scores instead.
      You are the opponent. Use the opening clues below. Each set contains exactly
      one mine: [3,8], [3,8,13], [8,13,17,18], [17], [17,22]. There are four mines total.
      Spend at most 100 tokens on reasoning. Identify a few easy safe cells, then make
      your best guess for the remaining order. Do not enumerate mine placements.
      Call play-game immediately with order containing each covered index exactly once:
      3, 4, 8, 9, 13, 14, 17, 18, 19, 22, 23, 24. Put your safest choices first.
      After success, say “Your new board is ready in the Result tab.” Keep the opponent's
      outcome, history, score, and mine locations out of the chat until comparison.
    runner: tool
    tools: [play_game]
    reference: null
    instructions: Play and verify the opponent's game before opening the human board.
  compare-scores:
    description: >-
      Compare a finished round. Copy game_id and the human reveal history from the
      request. A game_id starting with round- contains the opponent's moves. If
      the ID is from an older version, direct the player to start a new round.
    runner: tool
    tools: [compare_scores]
    reference: null
    instructions: Replay and compare the two supplied reveal histories.
